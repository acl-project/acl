[workspace]
resolver = "3"
members = [
    "crates/acl-gui",
    "crates/acl-core",
    "crates/acl-minecraft",
    "crates/acl-auth",
    "crates/acl-common",
    "xtask",
]

default-members = ["crates/acl-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[workspace.dependencies]

acl-core = { path = "crates/acl-core" }
acl-minecraft = { path = "crates/acl-minecraft" }
acl-auth = { path = "crates/acl-auth" }
acl-common = { path = "crates/acl-common" }

gtk = { version = "0.11.5", package = "gtk4" }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
relm4 = { version = "0.11.0", features = ["libadwaita", "macros"] }
relm4-components = "0.11.0"
relm4-macros = "0.11.0"

#Async & HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "process", "io-util", "net"] }
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }

# Serialization & Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

thiserror = "2"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

directories = "6"
uuid = { version = "1.0", features = ["v3", "v4", "serde"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
glob = "0.3"
sysinfo = "0.40"
sys-locale = "0.3"
iana-time-zone = "0.1"
keyring = { version = "4", default-features = false, features = ["v1","zbus-secret-service-keyring-store"] }

i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
rust-embed = "8"
unic-langid = "0.9"
fluent = "0.17"
fluent-syntax = "0.12"

syn = { version = "3.0", features = ["full", "extra-traits"] }
proc-macro2 = "1.0"
walkdir = "2.5"
clap = { version = "4.6", features = ["derive"] }
heck = "0.5"
[workspace]
resolver = "3"
members = [
    "crates/acl-gui",
    "crates/acl-core",
    "crates/acl-minecraft",
    "crates/acl-auth",
    "crates/acl-common",
]

default-members = ["crates/acl-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[workspace.dependencies]

acl-core = { path = "crates/acl-core" }
acl-minecraft = { path = "crates/acl-minecraft" }
acl-auth = { path = "crates/acl-auth" }
acl-common = { path = "crates/acl-common" }

gtk = { version = "0.11.5", package = "gtk4" }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
relm4 = { version = "0.11.0", features = ["libadwaita", "macros"] }
relm4-components = "0.11.0"
relm4-macros = "0.11.0"

#Async & HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }

# Serialization & Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

thiserror = "2"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

directories = "6"
uuid = { version = "1.0", features = ["v3", "v4", "serde"] }
sha1 = "0.10"
hex = "0.4"
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
glob = "0.3"
sysinfo = "0.40"